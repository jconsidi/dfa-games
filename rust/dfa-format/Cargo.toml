[package]
name = "dfa-format"
version.workspace = true
edition.workspace = true
description = "Reader, writer and validator for the DFA single-file format (FORMAT-DFA.md)"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
memmap2 = "0.9"
sha2 = "0.10"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "dfa-convert"
path = "src/bin/dfa-convert.rs"

[[bin]]
name = "dfa-stats"
path = "src/bin/dfa-stats.rs"

[[bin]]
name = "dfa-validate"
path = "src/bin/dfa-validate.rs"

[[bin]]
name = "dfa-verify-union"
path = "src/bin/dfa-verify-union.rs"
